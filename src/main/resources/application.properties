spring.application.name=data-kinerja
server.port=8181
server.servlet.context-path=/api/v1

# --- DATABASE CONFIGURATION ---
# GANTI 'nama_db_kamu' dengan nama database yang sudah kamu buat di PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- FLYWAY CONFIGURATION ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Lokasi script migrasi (default-nya memang di sini, ditulis eksplisit biar jelas)
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.override-with-generic-response=false
springdoc.show-actuator=false

# --- LOGGING (Opsional, biar enak debug query) ---
logging.level.org.springframework.jdbc.core=DEBUG